name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach the installers to (e.g. v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: Build and attach Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci

      - name: Build installers and attach them to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.release.tag_name || inputs.tag }}
          releaseName: 'Chest Tracker __VERSION__'
          releaseBody: |
            Windows desktop build of Chest Tracker.

            Download `Chest Tracker_<version>_x64-setup.exe` (NSIS) or the `.msi`,
            run it, and the tracker installs for the current user.

            The web version stays available in this repository and needs no install.
          releaseDraft: false
          prerelease: false
          args: ''
