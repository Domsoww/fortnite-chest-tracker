[package]
name = "fortnite-chest-tracker"
version = "2.0.0"
description = "Local-first chest tracker for Fortnite players, with global shortcuts and a system tray."
authors = ["Chest Tracker contributors"]
license = "MIT"
repository = "https://github.com/Domsoww/fortnite-chest-tracker"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chest_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
